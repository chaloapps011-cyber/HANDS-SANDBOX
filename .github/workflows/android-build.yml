name: HANDS SANDBOX Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GODOT_VERSION: 4.4.1
      ANDROID_NDK_VERSION: 23.2.8568313
      ANDROID_BUILD_TOOLS_VERSION: 34.0.0
      ANDROID_PLATFORM_VERSION: 34

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Folded YAML joins these entries with spaces for sdkmanager.
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;23.2.8568313
            cmake;3.10.2.4988404

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "Android toolchain verification failed (exit $status) at line $LINENO" >&2; exit "$status"' ERR

          : "${ANDROID_HOME:?ANDROID_HOME is not set by the Android SDK setup}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          java -version
          "$ANDROID_HOME/platform-tools/adb" version
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt" version
          test -d "$ANDROID_HOME/platforms/android-$ANDROID_PLATFORM_VERSION"
          test -x "$ANDROID_NDK_HOME/ndk-build"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          echo "Android SDK, platform, build-tools, NDK, and CMake are present."

      - name: Setup Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install official Godot export templates
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "Godot export template installation failed (exit $status) at line $LINENO" >&2; exit "$status"' ERR

          templates_version="4.4.1.stable"
          templates_dir="$HOME/.local/share/godot/export_templates/$templates_version"
          archive="$RUNNER_TEMP/Godot_v4.4.1-stable_export_templates.tpz"
          extracted="$RUNNER_TEMP/godot-export-templates"

          mkdir -p "$extracted" "$templates_dir"
          curl --fail --location --retry 3 --show-error \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            --output "$archive"
          unzip -o "$archive" -d "$extracted"
          test -d "$extracted/templates"
          cp -av "$extracted/templates/." "$templates_dir/"

          for template in android_debug.apk android_release.apk; do
            if [[ ! -s "$templates_dir/$template" ]]; then
              echo "Required template missing or empty: $templates_dir/$template" >&2
              find "$templates_dir" -maxdepth 1 -type f -printf '%f (%s bytes)\n' >&2 || true
              exit 1
            fi
            echo "Verified $templates_dir/$template ($(stat -c '%s' "$templates_dir/$template") bytes)"
          done

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "Godot Android path configuration failed (exit $status) at line $LINENO" >&2; exit "$status"' ERR

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"
          godot --version

      - name: Validate Android export preset
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "Android preset validation failed (exit $status) at line $LINENO" >&2; exit "$status"' ERR

          grep -Fx 'name="Android"' export_presets.cfg
          grep -Fx 'platform="Android"' export_presets.cfg
          grep -Fx 'architectures/arm64-v8a=true' export_presets.cfg
          grep -Fx 'package/unique_name="com.chaloapps.handsandbox"' export_presets.cfg
          echo "Android preset name, package ID, and arm64-v8a architecture verified."

      - name: Export debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "Godot Android debug export failed (exit $status) at line $LINENO" >&2; exit "$status"' ERR

          mkdir -p build
          godot --headless --verbose --path . \
            --export-debug "Android" \
            build/HANDS_SANDBOX.apk

          test -s build/HANDS_SANDBOX.apk
          unzip -t build/HANDS_SANDBOX.apk
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt" dump badging build/HANDS_SANDBOX.apk | grep -F "package: name='com.chaloapps.handsandbox'"
          file build/HANDS_SANDBOX.apk
          sha256sum build/HANDS_SANDBOX.apk
          echo "Debug APK export and validation completed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HANDS-SANDBOX-APK
          path: build/HANDS_SANDBOX.apk
          if-no-files-found: error
          compression-level: 0
