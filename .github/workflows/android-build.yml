
name: HANDS SANDBOX Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -L --fail \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -o templates.tpz
          unzip -o templates.tpz -d templates
          cp -a templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/HANDS_SANDBOX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HANDS-SANDBOX-APK
          path: build/HANDS_SANDBOX.apk
