name: HANDS SANDBOX Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install Godot 4.4.1 export templates
        shell: bash
        run: |
          set -Eeuo pipefail

          templates_version="4.4.1.stable"
          templates_dir="$HOME/.local/share/godot/export_templates/$templates_version"
          archive="$RUNNER_TEMP/Godot_v4.4.1-stable_export_templates.tpz"
          extracted_dir="$RUNNER_TEMP/godot-export-templates"

          mkdir -p "$extracted_dir" "$templates_dir"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            --output "$archive"
          unzip "$archive" -d "$extracted_dir"

          if [[ ! -d "$extracted_dir/templates" ]]; then
            echo "Official template archive did not contain the expected templates/ directory." >&2
            find "$extracted_dir" -maxdepth 3 -type f -print >&2
            exit 1
          fi

          cp -av "$extracted_dir/templates/." "$templates_dir/"

          for template in android_debug.apk android_release.apk; do
            if [[ ! -s "$templates_dir/$template" ]]; then
              echo "Missing or empty Android export template: $templates_dir/$template" >&2
              echo "Installed files in $templates_dir:" >&2
              find "$templates_dir" -maxdepth 1 -type f -printf '%f (%s bytes)\n' >&2
              exit 1
            fi
            echo "Verified: $templates_dir/$template ($(stat -c '%s' "$templates_dir/$template") bytes)"
          done

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-release "Android" \
            build/HANDS_SANDBOX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HANDS-SANDBOX-APK
          path: build/HANDS_SANDBOX.apk
