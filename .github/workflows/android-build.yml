name: HANDS SANDBOX Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-release "Android" \
            build/HANDS_SANDBOX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HANDS-SANDBOX-APK
          path: build/HANDS_SANDBOX.apk
